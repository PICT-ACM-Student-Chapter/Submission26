version: "3.9"

services:
  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    dns:
      - 8.8.8.8
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY}
      AWS_BUCKET: ${AWS_BUCKET}
      AWS_REGION: ${AWS_REGION}
      EMS_API: ${EMS_API}
      TOKEN_SECRET: ${TOKEN_SECRET}
      EVALUATION: ${EVALUATION}
    ports:
      - "3001:3001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5

  evaluation:
    container_name: evaluation
    build:
      context: ./dataquest-evaluation-server
    environment:
      PORT: 5000
    ports:
      - "5000:5000"
    networks:
      - app-network
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "wsgi:app"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    container_name: nginx
    build:
      context: ./nginx
    depends_on:
      server:
        condition: service_healthy
      evaluation:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/api.submission.pictacm.in:/etc/letsencrypt/live/api.submission.pictacm.in:ro
      - /etc/letsencrypt/archive/api.submission.pictacm.in:/etc/letsencrypt/archive/api.submission.pictacm.in:ro
    restart: always

networks:
  app-network:
    driver: bridge
