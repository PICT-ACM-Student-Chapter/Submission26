version: "3.9"

services:
  server:
    container_name: server
    restart: always
    build:
      context: ./server
      dockerfile: Dockerfile.prod
    dns:
      - 8.8.8.8
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      EMS_API: ${EMS_API}
      TOKEN_SECRET: ${TOKEN_SECRET}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    container_name: nginx
    build:
      context: ./nginx
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    networks:
      - app-network
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt/live/api.submission.pictacm.in:/etc/letsencrypt/live/api.submission.pictacm.in:ro
      - /etc/letsencrypt/archive/api.submission.pictacm.in:/etc/letsencrypt/archive/api.submission.pictacm.in:ro
    restart: always

networks:
  app-network:
    driver: bridge
