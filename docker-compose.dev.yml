version: "3"

services:
  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3001"
    volumes:
      - ./server:/usr/src/app
      - run_vol:/var/run
      - cache_vol:/var/cache
      - tmp_vol:/tmp
    env_file:
      - ./server/.env.dev
    command: >
      sh -c "npm install && NODE_ENV=dev npm run dev"
    depends_on:
      postgres:
        condition: service_healthy
      # - mongo

  postgres:
    container_name: postgres
    image: postgres
    env_file:
      - ./server/.env.dev
    environment:
      - POSTGRES_DB=submission
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes: 
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/create_tables.sql

  evaluation: 
    container_name: evaluation
    image: evaluation
    build:
      context: ./dataquest-evaluation-server
    ports:
      - "5000:5000"
    command: >
      sh -c "python3 -m venv venv && gunicorn --bind 0.0.0.0:5000 wsgi:app"

volumes:
  run_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  cache_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  tmp_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
      