version: "3"

services:
  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3001"
    volumes:
      - ./server:/usr/src/app
      - run_vol:/var/run
      - cache_vol:/var/cache
      - tmp_vol:/tmp
    env_file:
      - ./server/.env.dev
    command: >
      sh -c "npm install && NODE_ENV=dev npm run dev"
    # No database dependencies needed - using Neon DB

  evaluation: 
    container_name: evaluation
    image: evaluation
    build:
      context: ./dataquest-evaluation-server
    ports:
      - "5000:5000"
    command: >
      sh -c "python3 -m venv venv && gunicorn --bind 0.0.0.0:5000 wsgi:app"

volumes:
  run_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  cache_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  tmp_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
      