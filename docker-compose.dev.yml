version: "3"

services:
  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3001"
    volumes:
      - ./server:/usr/src/app
      - run_vol:/var/run
      - cache_vol:/var/cache
      - tmp_vol:/tmp
    env_file:
      - ./server/.env.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -c "npm install && NODE_ENV=dev npm run dev"
    # Using PostgreSQL database

volumes:
  run_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  cache_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs
  tmp_vol:
    driver_opts:
      type: tmpfs
      device: tmpfs